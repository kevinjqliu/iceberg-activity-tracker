name: Summarize community activity

on:
  schedule:
    # Weekly summary candidate. 15:17 UTC is 8:17am PT during daylight saving time.
    # Gated below to every 3 weeks starting 2026-06-24.
    - cron: "17 15 * * 3"
  workflow_dispatch:
    inputs:
      meeting_date:
        description: "Meeting date to summarize, as YYYY-MM-DD. Defaults to today's Pacific date."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: summarize-community-activity
  cancel-in-progress: false

env:
  UV_CACHE_DIR: .cache/uv

jobs:
  summarize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tracker
        uses: actions/checkout@v4

      - name: Resolve meeting cadence
        id: cadence
        shell: bash
        run: |
          event_name="${{ github.event_name }}"
          meeting_date="${{ github.event.inputs.meeting_date }}"
          if [ -z "$meeting_date" ]; then
            meeting_date="$(TZ=America/Los_Angeles date +%F)"
          fi

          resolved="$(
            python3 - "$event_name" "$meeting_date" <<'PY'
          from datetime import date, timedelta
          import sys

          event_name = sys.argv[1]
          meeting_date = date.fromisoformat(sys.argv[2])
          anchor_date = date(2026, 6, 24)

          days_since_anchor = (meeting_date - anchor_date).days
          is_three_week_meeting = days_since_anchor >= 0 and days_since_anchor % 21 == 0
          should_run = event_name == "workflow_dispatch" or is_three_week_meeting
          since_date = meeting_date - timedelta(days=21)

          print(f"should_run={str(should_run).lower()}")
          print(f"meeting_date={meeting_date}")
          print(f"summary_dir={since_date}_to_{meeting_date}")
          PY
          )"
          eval "$resolved"
          {
            echo "should_run=$should_run"
            echo "meeting_date=$meeting_date"
            echo "summary_dir=$summary_dir"
          } >> "$GITHUB_OUTPUT"

      - name: Skip off-cycle summary schedule
        if: steps.cadence.outputs.should_run != 'true'
        run: |
          echo "Skipping off-cycle summary schedule"

      - name: Install uv
        if: steps.cadence.outputs.should_run == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        if: steps.cadence.outputs.should_run == 'true'
        run: uv python install 3.12

      - name: Summarize meeting highlights
        if: steps.cadence.outputs.should_run == 'true'
        run: make summarize MEETING_DATE="${{ steps.cadence.outputs.meeting_date }}"

      - name: Commit and push summaries
        if: steps.cadence.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A summaries
          if git diff --cached --quiet; then
            echo "No summary changes to commit"
          else
            git commit -m "Update Iceberg summaries [auto]"
            git pull --rebase
            git push
          fi

      - name: Upload summary artifact
        if: steps.cadence.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iceberg-java-highlights-${{ steps.cadence.outputs.meeting_date }}
          path: summaries/${{ steps.cadence.outputs.summary_dir }}/
          if-no-files-found: error
