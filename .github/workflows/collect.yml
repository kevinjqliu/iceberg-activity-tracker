name: Collect commit activity

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tracker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install .

      - name: Collect Apache Iceberg activity
        run: iceberg-activity collect

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: iceberg-commit-activity
          path: data/commits/*.csv
          if-no-files-found: error
