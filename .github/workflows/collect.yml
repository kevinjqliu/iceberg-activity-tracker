name: Collect commit activity

on:
  schedule:
    # GitHub schedules are UTC. These two entries cover 6am Pacific in PDT/PST;
    # the workflow gates on America/Los_Angeles local hour below.
    - cron: "0 13 * * 3"
    - cron: "0 14 * * 3"
  workflow_dispatch:
    inputs:
      meeting_date:
        description: "Meeting date to summarize, as YYYY-MM-DD. Defaults to today's Pacific date."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: collect-commit-activity
  cancel-in-progress: false

env:
  UV_CACHE_DIR: .cache/uv

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tracker
        uses: actions/checkout@v4

      - name: Resolve meeting summary cadence
        id: summary
        shell: bash
        run: |
          meeting_date="${{ github.event.inputs.meeting_date }}"
          if [ -z "$meeting_date" ]; then
            meeting_date="$(TZ=America/Los_Angeles date +%F)"
          fi
          local_hour="$(TZ=America/Los_Angeles date +%H)"

          resolved="$(
            python3 - "$meeting_date" "${{ github.event_name }}" "$local_hour" <<'PY'
          from datetime import date, timedelta
          import sys

          meeting_date = date.fromisoformat(sys.argv[1])
          event_name = sys.argv[2]
          local_hour = sys.argv[3]
          anchor_date = date(2026, 6, 24)
          days_since_anchor = (meeting_date - anchor_date).days
          is_three_week_meeting = days_since_anchor >= 0 and days_since_anchor % 21 == 0
          is_six_am_pt = local_hour == "06"
          should_run = event_name == "workflow_dispatch" or (
              is_six_am_pt and is_three_week_meeting
          )
          since_date = meeting_date - timedelta(days=21)
          print(f"since_date={since_date}")
          print(f"should_run={str(should_run).lower()}")
          PY
          )"
          eval "$resolved"
          echo "meeting_date=$meeting_date" >> "$GITHUB_OUTPUT"
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "summary_dir=${since_date}_to_${meeting_date}" >> "$GITHUB_OUTPUT"

      - name: Skip off-cycle schedule
        if: steps.summary.outputs.should_run != 'true'
        run: echo "Skipping: not a 6am PT three-week meeting date."

      - name: Apply schedule jitter
        if: steps.summary.outputs.should_run == 'true' && github.event_name == 'schedule'
        shell: bash
        run: |
          delay=$(( RANDOM % 1200 ))
          echo "Sleeping ${delay}s before collection"
          sleep "$delay"

      - name: Install uv
        if: steps.summary.outputs.should_run == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        if: steps.summary.outputs.should_run == 'true'
        run: uv python install 3.12

      - name: Collect Apache Iceberg activity
        if: steps.summary.outputs.should_run == 'true'
        run: make collect

      - name: Summarize meeting highlights
        if: steps.summary.outputs.should_run == 'true'
        run: make summarize MEETING_DATE="${{ steps.summary.outputs.meeting_date }}"

      - name: Commit and push data changes
        if: steps.summary.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/commits summaries
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update Iceberg commit activity [auto]"
            git pull --rebase
            git push
          fi

      - name: Upload CSV artifact
        if: steps.summary.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iceberg-commit-activity
          path: data/commits/*.csv
          if-no-files-found: error

      - name: Upload summary artifact
        if: steps.summary.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iceberg-java-highlights-${{ steps.summary.outputs.meeting_date }}
          path: summaries/${{ steps.summary.outputs.summary_dir }}/*
          if-no-files-found: error
