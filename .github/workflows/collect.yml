name: Collect commit activity

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-commit-activity
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tracker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect Apache Iceberg activity
        run: make collect

      - name: Commit and push CSV changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/commits
          if git diff --cached --quiet; then
            echo "No CSV changes to commit"
          else
            git commit -m "Update Iceberg commit activity [auto]"
            git pull --rebase
            git push
          fi

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: iceberg-commit-activity
          path: data/commits/*.csv
          if-no-files-found: error
